#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Published coordinates:  implementation("$GROUP:$POM_ARTIFACT_ID:$VERSION_NAME") ----
# 2.0.0 = the Kotlin Multiplatform release (1.x was Android-only, on JitPack).
GROUP=io.github.rajumark
POM_ARTIFACT_ID=hideout
VERSION_NAME=2.0.0

# ---- POM metadata (required by Maven Central) ----
POM_NAME=Hideout
POM_DESCRIPTION=Hideout by Hoverfly: on-device personal info detector and hider for Kotlin Multiplatform (Android, iOS, macOS, JVM, JS, Wasm). Finds phone numbers, UPI IDs, Aadhaar, PAN, card and bank numbers, emails, names and addresses in text and replaces them with labels like [PHONE]. English, Hinglish, Hindi and other Indian languages. No dependencies, no network.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/rajumark/hideout
POM_LICENSE_NAME=Hoverfly Community License 1.0
POM_LICENSE_URL=https://github.com/rajumark/hideout/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/rajumark/hideout
POM_SCM_CONNECTION=scm:git:git://github.com/rajumark/hideout.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rajumark/hideout.git
POM_DEVELOPER_ID=rajumark
POM_DEVELOPER_NAME=rajumark
POM_DEVELOPER_URL=https://github.com/rajumark
