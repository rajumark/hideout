<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hideout Web</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Hideout</h1>
    <p id="platform" class="muted"></p>
    <textarea id="text" rows="3" placeholder="Message"></textarea>
    <section class="card">
        <div class="label">Hidden</div>
        <div id="out" class="out"></div>
        <div id="found"></div>
        <p id="timing" class="muted small"></p>
    </section>
    <h2>Try</h2>
    <div id="examples" class="row"></div>
    <p class="muted small">Runs on this device. No network, no permission.</p>
    <p id="load" class="muted small"></p>
</main>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
